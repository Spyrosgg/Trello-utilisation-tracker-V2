<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="https://p.trellocdn.com/power-up.min.css" />
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body>
  <p class="hint">Group the "Team effort over time" chart by:</p>

  <label class="settings__option">
    <input type="radio" name="granularity" value="week" id="gran-week" />
    Week
  </label>
  <label class="settings__option">
    <input type="radio" name="granularity" value="month" id="gran-month" />
    Month
  </label>

  <p class="hint" style="margin-top:16px;">
    Team size to divide the average-utilization chart by:
  </p>
  <div class="settings__team-size-row">
    <input type="number" id="team-size-input" min="1" step="1" placeholder="auto" />
    <span class="hint" style="margin:0 0 0 8px;">
      people (leave blank to use the current board member count)
    </span>
  </div>

  <button id="save" class="mod-primary" type="button" style="margin-top:16px;width:100%;">
    Save
  </button>

  <script src="./settings.js"></script>
</body>
</html>
